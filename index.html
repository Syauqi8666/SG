<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1.0" />  
<title>Clothing Shop with Admin</title>  
<style>  
  body {  
    font-family: Arial, sans-serif;  
    margin: 0; padding: 0;  
    background-color: #b40000;  
  }  
  header {  
    background: #002792; color: #000; padding: 10px 0; text-align: center;  
  }  
  nav {  
    margin: 20px;  
    text-align: center;  
  }  
  nav button {  
    padding: 10px 20px; margin: 0 10px; background-color: #fff; border: none; cursor: pointer; font-weight: bold;  
  }  
  /* Containers for shopping and admin */  
  .section {  
    display: block;  
  }  
  /* Hide sections */  
  .hidden {  
    display: none;  
  }  

  /* Shop styling */  
  .container {  
    width: 80%; margin: auto;  
  }  
  h2 { color: #fff; }  
  .product {  
    border: 1px solid #ccc;  
    margin: 20px;  
    padding: 20px;  
    background: #fff;  
    float: left;  
    width: calc(33.333% - 40px);  
    box-sizing: border-box;  
    position: relative;  
  }  
  .product img { max-width: 100%; }  
  .cart-section {  
    clear: both; padding: 20px; background: #eee; margin-top: 20px;  
  }  
  #totalPrice { font-weight: bold; font-size: 1.2em; }  
  #checkoutBtn {  
    padding: 10px 20px; font-size: 16px; margin-top: 10px;  
  }  

  /* QR Popup styles */  
  #qrPopup {  
    display: none; position: fixed; top: 0; left:0; right:0; bottom:0;  
    background: rgba(0,0,0,0.5);  
    justify-content: center; align-items: center; z-index: 1000;  
  }  
  #qrContent {  
    background: #fff; padding: 20px; text-align: center; position: relative;  
  }  
  #closeQR {  
    position: absolute; top: 5px; right: 10px; font-size: 20px; cursor: pointer;  
  }  

  /* Admin styling */  
  #adminSection {  
    display: none; padding: 20px;  
  }  
  table {  
    width: 100%; border-collapse: collapse; background: #fff;  
  }  
  th, td { padding: 15px; border: 1px solid #ccc; text-align: left; }  
  th { background: #333; color: #fff; }  
  .paid { color: green; font-weight: bold; }  
  .unpaid { color: red; font-weight: bold; }  
</style>  
</head>  
<body>  

<header>  
<h1 style="color:#fff;">Welcome to Our Clothing Shop</h1>  
</header>  

<nav>  
<button onclick="showSection('shop')">Shop</button>  
<button onclick="showSection('admin')">Admin</button>  
</nav>  

<!-- Shop section -->  
<div id="shop" class="section">  
<div class="container">  
<h2>Featured Products</h2>  
<div class="product" data-name="Product 1" data-price="19.99">  
    <img src="https://via.placeholder.com/150" alt="Product 1" />  
    <h3>Product 1</h3>  
    <p>Price: $19.99</p>  
    <button class="addToCartBtn">Add to Cart</button>  
</div>  
<div class="product" data-name="Product 2" data-price="29.99">  
    <img src="https://via.placeholder.com/150" alt="Product 2" />  
    <h3>Product 2</h3>  
    <p>Price: $29.99</p>  
    <button class="addToCartBtn">Add to Cart</button>  
</div>  
<div class="product" data-name="Product 3" data-price="24.99">  
    <img src="https://via.placeholder.com/150" alt="Product 3" />  
    <h3>Product 3</h3>  
    <p>Price: $24.99</p>  
    <button class="addToCartBtn">Add to Cart</button>  
</div>  

<!-- Cart and checkout -->  
<div class="cart-section">  
  <p>Total: <span id="totalPrice">$0.00</span></p>  
  <button id="checkoutBtn">Checkout</button>  
</div>  
</div>  
</div>  

<!-- Admin section -->  
<div id="admin" class="section hidden">  
<h2>Order List</h2>  
<table id="orderTable">  
  <thead>  
    <tr>  
      <th>Order ID</th><th>Customer</th><th>Items</th><th>Total ($)</th><th>Status</th><th>Action</th>  
    </tr>  
  </thead>  
  <tbody></tbody>  
</table>  
</div>  

<!-- QR code popup -->  
<div id="qrPopup">  
  <div id="qrContent">  
    <span id="closeQR">&times;</span>  
    <h2>Scan QR to Pay</h2>  
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PaymentLink123" alt="QR Code" />  
  </div>  
</div> 

<!-- Login overlay -->  
<div id="loginOverlay" style="display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:2000;">  
    <div style="background:#fff; padding:20px; border-radius:8px; text-align:center;">  
      <h2>Select Login Type</h2>  
      <button onclick="loginAs('customer')">Customer</button>  
      <button onclick="loginAs('admin')">Admin</button>  
    </div>  
  </div>  

<script>  
  // Switch sections  
  function showSection(sectionId) {  
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));  
    document.getElementById(sectionId).classList.remove('hidden');  
  }  

  const addButtons = document.querySelectorAll('.addToCartBtn');  
  const totalPriceSpan = document.getElementById('totalPrice');  
  const checkoutBtn = document.getElementById('checkoutBtn');  
  const qrPopup = document.getElementById('qrPopup');  
  const closeQR = document.getElementById('closeQR');  
  const orderTableBody = document.querySelector('#orderTable tbody');  

  let total = 0;  

  // Load existing orders on start  
  let orders = JSON.parse(localStorage.getItem('orders')) || [];  

  // Add products to cart  
  addButtons.forEach(btn => {  
    btn.addEventListener('click', () => {  
      const productDiv = btn.closest('.product');  
      const price = parseFloat(productDiv.dataset.price);  
      total += price;  
      totalPriceSpan.textContent = `$${total.toFixed(2)}`;  
    });  
  });  

  // Checkout event  
document.getElementById('checkoutBtn').addEventListener('click', () => {  
  if (total > 0) {  
    const customerName = prompt('Enter your name for the order:');  
    if (customerName) {  
      const productEls = document.querySelectorAll('.product');  
      const items = Array.from(productEls).map(p => p.querySelector('h3').innerText);  
      const orderId = 'ORD' + Date.now();  
      const newOrder = {  
        id: orderId,  
        customer: customerName,  
        items: items,  
        total: total.toFixed(2),  
        paid: false  
      };  
      orders.push(newOrder);  
      // Save orders  
      localStorage.setItem('orders', JSON.stringify(orders));  
      alert('Order saved!');  

      // Add to admin table  
      addOrderToTable(newOrder);  

      // Show QR code popup  
      document.getElementById('qrPopup').style.display = 'flex';  

      // Reset cart  
      total = 0;  
      totalPriceSpan.textContent = "$0.00";  
    }  
  } else {  
    alert('Add some products to cart before checkout!');  
  }  
});  

// Close QR popup  
closeQR.addEventListener('click', () => {  
  document.getElementById('qrPopup').style.display = 'none';  
});  
window.addEventListener('click', (e) => {  
  if (e.target == document.getElementById('qrPopup')) {  
    document.getElementById('qrPopup').style.display = 'none';  
  }  
});  

// Function to add order to admin table  
function addOrderToTable(order) {  
  const tbody = document.querySelector('#orderTable tbody');  
  const row = document.createElement('tr');  
  row.innerHTML = `  
    <td>${order.id}</td>  
    <td>${order.customer}</td>  
    <td>${order.items.join(', ')}</td>  
    <td>${order.total}</td>  
    <td class="${order.paid ? 'paid' : 'unpaid'}">${order.paid ? 'Paid' : 'Unpaid'}</td>  
    <td>  
      <button onclick="togglePayment('${order.id}')">${order.paid ? 'Mark Unpaid' : 'Mark Paid'}</button>  
    </td>  
  `;  
  tbody.appendChild(row);  
}  

// Load existing orders into table  
function loadOrders() {  
  orderTableBody.innerHTML = '';  
  orders.forEach(order => addOrderToTable(order));  
}  
// Populate admin table on page load  
if (document.querySelector('#orderTable tbody')) {  
  loadOrders();  
}  

// Function to toggle payment status  
function togglePayment(orderId) {  
  orders = JSON.parse(localStorage.getItem('orders')) || [];  
  const order = orders.find(o => o.id === orderId);  
  if (order) {  
    order.paid = !order.paid;  
    localStorage.setItem('orders', JSON.stringify(orders));  
    // Refresh the table  
    loadOrders();  
  }  
}  
</script>  
</body>  
</html>
